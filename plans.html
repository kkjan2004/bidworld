<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BidWorld - Plans Setup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="admin.html" class="logo">🟢 BidWorld Admin</a>
        <nav>
            <a href="admin.html">Admin Home</a>
            <a href="plans.html" class="active">Plans</a>
        </nav>
    </header>
    <div class="container">
        <h2 style="margin-bottom: 15px; font-size: 20px;">Referral & Matrix Setup</h2>
        
        <div class="card">
            <h3 style="color: var(--primary); margin-bottom: 8px;">Referral Plan Setup</h3>
            <p style="margin-bottom: 12px;">Set the number of levels and define rewards as JSON format:</p>
            <div style="background: #F3F4F6; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 12px; margin-bottom: 12px; overflow-x: auto;">
                [{"level":1,"type":"percent","value":5},<br>{"level":2,"type":"percent","value":2}]
            </div>

            <label>Plan Name</label>
            <input type="text" id="planName" placeholder="e.g. Standard Referral Plan">

            <label>Number of Levels (1-20)</label>
            <input type="number" id="numLevels" value="5" min="1" max="20">

            <label>Level Reward Rules (JSON)</label>
            <textarea id="rewardRules" rows="4" style="font-family: monospace;">[{"level":1,"type":"percent","value":5},{"level":2,"type":"percent","value":2}]</textarea>

            <button class="btn" style="width: 100%; margin-top: 5px;" onclick="saveReferralPlan()">Save Referral Plan</button>
        </div>

        <div class="card">
            <h3 style="color: var(--primary); margin-bottom: 8px;">Existing Referral Plans</h3>
            <p id="existingPlansStatus">No referral plans configured yet.</p>
        </div>
    </div>
    <script src="shared.js"></script>
    <script>
        function saveReferralPlan() {
            showToast('Referral plan saved successfully!');
        }
    </script>
</body>
</html>
